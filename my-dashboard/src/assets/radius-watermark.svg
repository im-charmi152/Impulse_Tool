<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <!-- Network Icon for watermark -->
  <g opacity="0.15">
    <!-- Center circle -->
    <circle cx="100" cy="100" r="30" fill="#0052CC"/>
    <!-- Top circle -->
    <circle cx="100" cy="35" r="20" fill="#0052CC"/>
    <!-- Right circle -->
    <circle cx="165" cy="70" r="20" fill="#0052CC"/>
    <!-- Right-bottom circle -->
    <circle cx="155" cy="135" r="20" fill="#0052CC"/>
    <!-- Bottom circle -->
    <circle cx="100" cy="165" r="20" fill="#0052CC"/>
    <!-- Left-bottom circle -->
    <circle cx="45" cy="135" r="20" fill="#0052CC"/>
    <!-- Left circle -->
    <circle cx="35" cy="70" r="20" fill="#0052CC"/>
    <!-- Top-right circle (yellow) -->
    <circle cx="135" cy="40" r="18" fill="#FFA500"/>
    
    <!-- Connection lines -->
    <line x1="100" y1="65" x2="100" y2="35" stroke="#0052CC" stroke-width="4"/>
    <line x1="120" y1="85" x2="155" y2="70" stroke="#0052CC" stroke-width="4"/>
    <line x1="130" y1="125" x2="145" y2="135" stroke="#0052CC" stroke-width="4"/>
    <line x1="100" y1="130" x2="100" y2="165" stroke="#0052CC" stroke-width="4"/>
    <line x1="80" y1="125" x2="60" y2="135" stroke="#0052CC" stroke-width="4"/>
    <line x1="60" y1="85" x2="45" y2="70" stroke="#0052CC" stroke-width="4"/>
    <line x1="100" y1="65" x2="130" y2="58" stroke="#0052CC" stroke-width="4"/>
  </g>
</svg>