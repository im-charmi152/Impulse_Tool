<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <!-- Network Icon for header -->
  <g>
    <!-- Center circle -->
    <circle cx="100" cy="100" r="24" fill="#0052CC"/>
    <!-- Top circle -->
    <circle cx="100" cy="50" r="16" fill="#0052CC"/>
    <!-- Right circle -->
    <circle cx="150" cy="80" r="16" fill="#0052CC"/>
    <!-- Right-bottom circle -->
    <circle cx="140" cy="130" r="16" fill="#0052CC"/>
    <!-- Bottom circle -->
    <circle cx="100" cy="150" r="16" fill="#0052CC"/>
    <!-- Left-bottom circle -->
    <circle cx="60" cy="130" r="16" fill="#0052CC"/>
    <!-- Left circle -->
    <circle cx="50" cy="80" r="16" fill="#0052CC"/>
    <!-- Top-right circle (yellow) -->
    <circle cx="130" cy="52" r="14" fill="#FFA500"/>
    
    <!-- Connection lines -->
    <line x1="100" y1="72" x2="100" y2="50" stroke="#0052CC" stroke-width="3"/>
    <line x1="115" y1="88" x2="145" y2="80" stroke="#0052CC" stroke-width="3"/>
    <line x1="125" y1="120" x2="140" y2="130" stroke="#0052CC" stroke-width="3"/>
    <line x1="100" y1="122" x2="100" y2="150" stroke="#0052CC" stroke-width="3"/>
    <line x1="85" y1="120" x2="70" y2="130" stroke="#0052CC" stroke-width="3"/>
    <line x1="75" y1="88" x2="55" y2="80" stroke="#0052CC" stroke-width="3"/>
    <line x1="100" y1="72" x2="128" y2="66" stroke="#0052CC" stroke-width="3"/>
  </g>
</svg>